name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test --enable-code-coverage

      - name: Shell scripts parse
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Coverage summary
        # Report only — no threshold, so a refactor never fails on a number.
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROFILE=$(find .build -name default.profdata -print -quit)
          found=0
          while IFS= read -r -d '' bundle; do
            target=$(basename "$bundle" .xctest)
            executable="$bundle/Contents/MacOS/$target"
            [[ -x "$executable" ]] || continue
            found=1
            echo "== $target =="
            xcrun llvm-cov report "$executable" \
              -instr-profile "$PROFILE" Sources Tests || true
          done < <(find "$BIN_PATH" -maxdepth 2 -name '*.xctest' -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "No test bundles found; skipping the coverage report."
          fi

  speech-integration:
    name: Apple Speech integration
    # Hosted macOS runners do not expose the Speech language assets. Run this
    # job on a runner with a real Speech stack by setting the repository
    # variable SPEECH_INTEGRATION=true.
    if: vars.SPEECH_INTEGRATION == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Transcribe committed audio fixtures
        # macOS downloads its language assets on first use. File transcription
        # does not need audio hardware.
        run: SCRIB3_INTEGRATION=1 swift test --filter AppleSpeechIntegration

  package:
    name: Package ${{ matrix.arch }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build, sign ad-hoc, verify
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          scripts/package.sh "${{ matrix.arch }}" "$VERSION" "${{ github.run_number }}"

      - name: Upload unsigned development package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrib3-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            dist/**/*.zip
            dist/**/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
